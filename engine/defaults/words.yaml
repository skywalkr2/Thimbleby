# Words the engine writes into the person's own records itself, by wording-sheet key. The screens' wording sheet carries
# the same keys; the workspace's `ui.wording` overrides either.

# The name of the project that holds the person's own life, made when a workspace is set up.
project.personal_name: Personal

# The title of a calendar entry made from a booking confirmation: the kind of booking, then where (a route for a trip).
booking.title: "{kind}: {detail}"
booking.route: "{place} to {destination}"
booking.kind.flight: Flight
booking.kind.lodging: Stay
booking.kind.event: Event
booking.kind.restaurant: Table
booking.kind.rental_car: Rental car
booking.kind.train: Train

# What the change that moves unsure items says, and the standing rule proposed after the same sender's items are moved a
# second time: {side} is the side's name, {sender} the address the mail came from.
filing.move_summary: "Moved to {side} on screen"
filing.rule_text: "Mail from {sender} goes to {side}."
filing.rule_source: "You moved this sender's items to the same place twice."

# The title of a note made from a mail: its subject, then who sent it; with no subject, the first words of the body.
note.title_from: "{subject} · from {sender}"
note.title_from_unknown: "{subject}"
