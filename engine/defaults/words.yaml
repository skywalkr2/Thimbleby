# Words the engine writes into the person's own records itself, by wording-sheet key. The screens' wording sheet carries
# the same keys; the workspace's `ui.wording` overrides either.

# The name of the project that holds the person's own life, made when a workspace is set up.
project.personal_name: Personal

# The title of a calendar entry made from a booking confirmation: the kind of booking, then where (a route for a trip).
booking.title: "{kind}: {detail}"
booking.route: "{place} to {destination}"
booking.kind.flight: Flight
booking.kind.lodging: Stay
booking.kind.event: Event
booking.kind.restaurant: Table
booking.kind.rental_car: Rental car
booking.kind.train: Train

# What the change that moves unsure items says, and the standing rule proposed after the same sender's items are moved a
# second time: {side} is the side's name, {sender} the address the mail came from.
filing.move_summary: "Moved to {side} on screen"
filing.rule_text: "Mail from {sender} goes to {side}."
filing.rule_source: "You moved this sender's items to the same place twice."

# The title of a note made from a mail: its subject, then who sent it; with no subject, the first words of the body.
note.title_from: "{subject} · from {sender}"
note.title_from_unknown: "{subject}"

# How a message opens to someone who is only on the person's own life, by how they relate to the person: for each kind,
# the words in the person's description of them that mean it (separated by commas) and the opening line, {first_name}
# being the name a greeting to them uses. Anyone else on the own life gets `greeting.personal`; a colleague's message
# opens as the greeting setting says.
greeting.personal: "Hi {first_name}, hope you're doing well."
greeting.relation_words.partner: partner, wife, husband, spouse
greeting.relation.partner: "Hi {first_name},"
greeting.relation_words.parent: parent, mother, father, mom, dad, mum
greeting.relation.parent: "Hi {first_name},"
greeting.relation_words.child: child, son, daughter
greeting.relation.child: "Hi {first_name},"
greeting.relation_words.sister: sister, sis
greeting.relation.sister: "Hi {first_name}, hope you're well."
greeting.relation_words.brother: brother, bro
greeting.relation.brother: "Hi {first_name}, hope you're well."
greeting.relation_words.friend: friend
greeting.relation.friend: "Hey {first_name}, hope you're doing well."
greeting.relation_words.neighbor: neighbor, neighbour
greeting.relation.neighbor: "Hi {first_name}, hope you're well."
greeting.relation_words.landlord: landlord, landlady
greeting.relation.landlord: "Hello {first_name},"
greeting.relation_words.school: school, teacher
greeting.relation.school: "Hello {first_name},"
greeting.relation_words.tradesperson: tradesperson, plumber, electrician, builder
greeting.relation.tradesperson: "Hello {first_name},"
greeting.relation_words.doctor: doctor, dentist, nurse
greeting.relation.doctor: "Hello {first_name},"
