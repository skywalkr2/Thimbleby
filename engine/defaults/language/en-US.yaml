# Lines an item's title never comes from (patterns, matched at the start of a line, ignoring case).
title_skip: [(hi|hello|hey|dear|good (morning|afternoon|evening)|greetings)\b,
  '(from|to|cc|bcc|sent|date|subject|reply-to)\s*:', '(thanks|thank you|best|regards|cheers|sincerely)\b[ ,!.]*$',
  '-{2,}|_{2,}|>']
# Patterns (regular expressions) for words that look like a system name or an acronym; matched as written.
new_term_patterns: ['\b[A-Z]{2,}[0-9]*\b', '\b[A-Z][a-z0-9]+(?:[A-Z][a-z0-9]+)+\b']
# Everyday abbreviations that match those patterns and are never suggested as new terms.
new_term_ignore: [OK, FYI, ASAP, TBD, TBC, EOD, ETA, AM, PM, RE, FW, CC, BCC, NB, PS, URGENT, NOTE, UPDATE, REMINDER]

# Reported speech: how a typed note that repeats someone else's words is recognized.
reported_speech:
  # Words that, after a name, mark a note as repeating someone's words ("<name> said ...").
  verbs: [said, says, confirmed, confirms, told, wrote, writes, asked, wants, mentioned, replied, responded, noted,
    commented, pinged]
  # Words that, before a name, do the same ("per <name> ...").
  lead_words: [per, according to]
  # Speakers that are the person themselves.
  own_speakers: [I, we]
  # Words that, right after a speech word, make it a request to the person ("<name> asked me to ...").
  request_words: [me to, us to]
  # Patterns for a line of a pasted chat: a time and who wrote it (matched at the start of a line).
  chat_line_patterns:
    - '^\s*[\[(]?\d{1,2}:\d{2}(?::\d{2})?(?:\s?[AaPp][Mm])?(?:,\s?[\d/.-]{6,10})?[^\w\n:]{0,4}[^\W\d_][\w''’. -]{0,40}:\s+\S'
    - '^\s*[^\W\d_][\w''’.-]*(?:\s+[^\W\d_][\w''’.-]*){0,2}\s+[\[(]?\d{1,2}:\d{2}(?::\d{2})?\s?[AaPp][Mm][\])]?\s*$'

# Dates and times: the words a due date is read from, and the phrases it can be written in. A pattern may hold {iso},
# {day}, {month} and {year}, which stand for the day looked for.
# Words that begin a due date's words without being part of it ("due Oct 22").
due_lead_words: [by, 'on', due, due on, due by, on or before, no later than, not later than]
# The endings that make a number the day of a month ("the 25th"). Matched as written.
due_ordinal_suffixes: [st, nd, rd, th]
# Words that tie a due to something that happens, so it has no date ("once the keys arrive").
due_condition_words: [once, after, before, when, whenever, until, till, if, unless, upon, as soon as, of receiving,
  of receipt, sometime, soon, eventually]
# Of those, the ones that put a promise on hold from the start.
due_hold_words: [once, after, when, whenever, until, till, if, unless, upon, as soon as, of receiving, of receipt]
# Of those, the ones after which a calendar entry may be named ("before the print sync").
due_before_words: [before]
# The day-and-time phrases the date reader knows, by what they mean. Each meaning is a list of whole phrases.
due_phrase_words:
  day_after_tomorrow: [day after tomorrow]
  later_today: [later today]
  tonight: [tonight]
  noon: [noon, midday]
  midnight: [midnight]
  first_thing: [first thing]
  end_of_month: [end of month, end of the month, end of this month]
  end_of_next_month: [end of next month, end of the next month]
  this_weekend: [this weekend]
  within: [within]
  hours: [hours, hour]
  days: [days, day]
  working_days: [working days, working day, business days, business day]
# The number words read in "within two working days", each with its number.
due_number_words: {one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, twelve: 12}
# Time zone abbreviations and plain names, and the zone each names ("5pm ET").
time_zone_abbreviations:
  ET: America/New_York
  EST: America/New_York
  EDT: America/New_York
  Eastern: America/New_York
  Eastern time: America/New_York
  CT: America/Chicago
  CST: America/Chicago
  CDT: America/Chicago
  Central: America/Chicago
  Central time: America/Chicago
  MT: America/Denver
  MST: America/Denver
  MDT: America/Denver
  Mountain: America/Denver
  Mountain time: America/Denver
  PT: America/Los_Angeles
  PST: America/Los_Angeles
  PDT: America/Los_Angeles
  Pacific: America/Los_Angeles
  Pacific time: America/Los_Angeles
  UTC: UTC
  GMT: UTC
  BST: Europe/London
# How a day is written in running text, to tie records to a date that moves.
date_patterns: ['{iso}', '\b{day}(?:st|nd|rd|th)?\s+(?:of\s+)?{month}\b', '\b{month}\.?\s+{day}(?:st|nd|rd|th)?\b',
  '\bthe\s+{day}(?:st|nd|rd|th)\b']
# The verbs a task's title starts with, so a plain calendar entry that starts with one is offered as a to-do.
task_verbs: [pay, send, call, email, text, book, buy, order, renew, submit, file, return, pick, drop, cancel, confirm,
  schedule, register, sign, review, write, finish, prepare, collect, fix, clean, pack, check, ask, remind, reply,
  print, post, pickup, organize, arrange]

# Endings: the words that read how an action ended from the words quoted for it. Delivered is done; learned another way,
# moved to a meeting or no longer needed is called off; only "closed" asks the person which it was.
# Words that say it was delivered.
delivery_words: [sent, finished, delivered, it's in, its in, did it, done, completed, handed in, turned in, submitted,
  shipped, attached, uploaded, published, emailed, mailed, posted, paid, booked, signed, returned, taken care of,
  took care of, came through, they did, she did, he did, went out, gone out, is out, handed over, shared, forwarded,
  got it, received, arrived]
# Words that say it was learned another way, moved to a meeting or no longer matters.
called_off_words: [moot, covered by, covered in, will cover, we'll cover, we will cover, will be covered,
  no longer needed, no longer need, not needed, isn't needed, no need, don't need, drop it, drop this, call it off,
  called off, cancel, canceled, cancelled, never mind, forget it, we'll get it in, we will get it in,
  in our discussions, in the discussions, in our discussion, in the planning sessions, in our planning, superseded,
  obsolete, unnecessary]
# Words that say it moved into a meeting.
meeting_words: [will cover, we'll cover, we will cover, will be covered, covered in, covered at, take it up,
  in our discussions, in the discussions, in our discussion, in the planning sessions, in our planning,
  we'll get it in, we will get it in, raise it, bring it up, discuss it, move it to, moved to]
# Words that only say it is closed.
closed_words: [close, closed, closing, close out, closed out]
