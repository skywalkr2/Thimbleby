  hill, history, hobby, hold, holiday, home, hope, horse, hospital, hot, hotel, hour, house, how, human, idea,
  important, in, income, insurance, interest, invoice, issue, it, item, job, join, journey, just, keep, key, kid,
  kind, king, kitchen, know, lab, lake, land, large, last, late, launch, law, lead, learn, leave, left, legal, lesson,
  letter, level, library, life, light, like, line, list, little, live, loan, local, long, look, lost, love, low, luck,
