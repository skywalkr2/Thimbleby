# How a person's dates are written in running text in this language: the month names read as a month, the words that
# make a fact about a person a date that comes round every year, the endings and joining words around a day, and
# whether the day or the month comes first. One file for each language, named by its primary language tag.
months:
  - [janvier, janv]
  - [février, févr, fevrier]
  - [mars]
  - [avril, avr]
  - [mai]
  - [juin]
  - [juillet, juil]
  - [août, aout]
  - [septembre, sept]
  - [octobre, oct]
  - [novembre, nov]
  - [décembre, déc, decembre]
yearly_words: [anniversaire]
day_endings: [er]
joining_words: []
orders: [day_first]
