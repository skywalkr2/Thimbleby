# What to do about a source that can't be read, one sentence per wording key. A connector names one with
# `ConnectorError(..., advice_key=...)`. These are the same sentences as in the screen's wording sheet
# (`web/src/wording/en.json`), kept here for the places the server writes a sentence itself (a question to the person,
# the result of Check now); a test checks the two stay the same.
sources.advice.check_credentials: "Check the user name and password in this connection's settings (Change, on Connections). If the service wants an app password, make one on its website and type it in the password box there. It is read again on its next turn."
sources.advice.check_password: "The password was not accepted. Type it again in the password box in this connection's settings (Change, on Connections). It is read again on its next turn."
sources.advice.create_app_password: "This service wants an app password, not your usual one. Make one in your account on its website, then type it in the password box in this connection's settings (Change, on Connections). It is read again on its next turn."
sources.advice.unlock_account: "The service has locked this account. Unlock it on the service's website; it is read again on its next turn."
sources.advice.check_sign_in_method: "The service has turned off this way of reading mail. Turn it on in your account on its website, or ask whoever runs it. It is read again on its next turn."
sources.advice.retry_later: "The service is busy. It is tried again on its schedule."
sources.advice.check_secure_connection: "The service wants a secure connection, which this one isn't using. Check the server and port in this connection's settings (Change, on Connections)."
sources.advice.review_server_message: "Read what the service said, then check the user name and password in this connection's settings (Change, on Connections). It is read again on its next turn."
sources.advice.service_app_password: "Follow the steps for {service} above to make an app password, then paste it here. Your usual password won't work for this."
sources.guide.failed: "Couldn't connect to {service}: {what}"
sources.refuse.same_folder: "{label} already reads this. Change that one, or choose another folder."
sources.refuse.no_such_folder: "This account has no folder called {folder}. Choose one it has."
sources.refuse.not_a_server: "That isn't a mail server's name. It looks like mail.example.com, with no spaces."
sources.refuse.unreachable: "Couldn't reach {where}. Check the address, and that this computer is online, then try again."
sources.refuse.asked_to_wait: "{where} asked to wait. Try again in a minute."
sources.refuse.not_answering: "{where} isn't answering right now. Try again in a few minutes."
sources.refuse.mailbox_auth: "{where} didn't accept that user name and password. Check both. Some services want an app password, which you make in your account on their website, instead of your usual one."
sources.refuse.mailbox_no_access: "{where} doesn't allow reading mail this way. Check your account on their website, or ask whoever runs it."
sources.refuse.not_a_link: "That isn't a web address. It starts with https:// and has no spaces."
sources.refuse.link_nothing_there: "Nothing is at that address. Check the link, or make a new one in the service's own settings."
sources.refuse.link_refused: "That address wouldn't let this in. Check the link, or make a new private one in the service's own settings."
sources.refuse.link_unexpected: "That address didn't give what was expected, or isn't answering. Check it, or try again in a few minutes."
sources.refuse.file_missing: "There is no file at {where}. Choose the file again."
sources.refuse.file_unusable: "That file can't be used as a calendar. Check that it is a calendar file you can open."
sources.refuse.folder_missing: "There is no folder at {where}. Choose a folder that exists."
sources.refuse.folder_unusable: "That folder can't be opened. Choose another."
sources.refuse.fill_in: "Fill this in."
sources.refuse.not_allowed: "That isn't allowed here."
sources.name.calendar_at: "Calendar at {host}"
