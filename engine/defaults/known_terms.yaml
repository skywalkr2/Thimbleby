# Known terms: names that mean the same thing everywhere, so the assistant never asks what they mean (design 6.22). It
# holds unmistakable names: countries, time zones, the names a mail program gives its folders, widely used services, the
# names of common file types, and everyday abbreviations a mail carries. Other short abbreviations, state and province
# codes among them (an address is recognized as a whole instead), are left off on purpose, since two to four letters often mean something particular where a person works
# (the glossary is where a workspace records such a meaning). Written for the core, by hand, not taken from any outside
# list. Case is ignored and whole words are matched. The setting `language.known_terms_shipped` turns the whole list off;
# `language.known_terms` adds a workspace's own words.
