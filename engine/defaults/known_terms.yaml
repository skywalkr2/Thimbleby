# Known terms: words everyone already knows, so the assistant never asks what they mean (design 6.22). It lists common
# abbreviations (country, region and state codes, units, time zone names, month and day names), the labels a mail
# program puts on its folders, and the names of widely used services. Written for the core, by hand, not taken from
# any outside list. Case is ignored and whole words are matched. The setting `language.known_terms_shipped` turns the
# whole list off; `language.known_terms` adds a workspace's own words.
