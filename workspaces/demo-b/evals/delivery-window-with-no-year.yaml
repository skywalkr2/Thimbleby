id: delivery-window-with-no-year
title: 'A delivery window written with no year is a range in the year a reader would take, with its tracking number'
skills: [dates, evidence]
received: '2026-10-27'
pasted: |-
  From: Bright Basket <orders@basket.example.com>
  To: Avery Lane <avery.lane@example.com>
  Subject: Order shipped and tracking number is ready (Order ID: BB-20417)

  Good news! Your order of a wool throw has shipped.
  Delivery: Oct 30-Nov 5
  Get a $5.00 credit if delivered after Nov 5.
  Carrier: Fastline. Tracking number: FL55120873.
