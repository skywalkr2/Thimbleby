id: day-30
title: The same mail on day 1 and after a month of history, which routes the question and reads the term differently
skills: [use-term, follow-routing, use-lesson]
# What the month has to change, written before the scenario is run: with the routing entry and the term kept, the
# question about reviewers goes to Ines Duarte instead of Maya Okafor, and the action says the second printing where day 1
# says Marlow. Nothing else may differ: the unrelated mail, the re-saved file and the moved meeting leave no trace in the
# answer.
input:
  received: '2026-11-12'
  project: PRJ-1
  pasted: |-
    From: Maya Lindqvist

    Which reviewers are getting advance copies? Also, Marlow is booked for the 24th, so please confirm the final files for it by the 20th.
# The month's noise follows one ordinary working week of real input: about 31% version bumps in watched page trees (title
# says "version"), 27% issue-tracker updates (`source: issues`), 22% edits on watched pages, 14% files saved into a shared
# folder (`source: folder`) and 7% the person's own notes and pastes, and about 86% of it ends with nothing for the
# person (`ops: []`). None of it may change the day-30 answer, so the expected numbers are the ones the shorter history
# had; the shares are held by `tests/test_pairs.py::test_the_scenarios_month_of_noise_follows_the_typical_weeks_shares`.
