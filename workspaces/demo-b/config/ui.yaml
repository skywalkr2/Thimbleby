version: 1
# Wording overrides by key from the UI's wording sheet.
wording: {}
shortcuts: {next: j, previous: k, primary: a, send_back: s, copy: c, edit: e, move: m, undo: u, hand_in: n, help: "?", ask: /, next_pane: "]", previous_pane: "[", show_new: "N"}
narrow_below_px: 640   # below this width: the phone layout, with a bottom bar
toast_seconds: 7
afternoon_from_hour: 13   # the hour of your day from which the opening brief is called the afternoon brief
links: [{name: Planning board, address: "https://planning-board.example.com/spring"}, {name: Shared schedule, address: "https://shared-schedule.example.com/team"}]   # links to your own pages, shown in the header
feedback_to: feedback@example.com   # where the feedback button writes
handled_group: kind   # how Handled for you groups what it lists to start with: kind, reason or sender
handled_rows_shown: 25   # how many rows a group shows before Show more
feedback_problem_days: 3   # how far back Send feedback offers to add failed work
feedback_problem_max: 20   # the most failures it offers to add
today: {mail_hours: 24, mail_max: 50, agenda_days_ahead: 1, schedule_days: 2, stale_after_days: 21, fold_batches_after_days: 3, top_priorities_lines: 4, top_priorities_ahead_days: 10}   # what Today's agenda and what came in cover
schedule: {week_starts_on: sunday, day_starts: "08:00", day_ends: "18:00", month_entries: 4}   # the calendar page: its week, its hours and its months
followups: {action_due_within_days: 5, undated_after_days: 10, question_after_days: 3, second_nudge_items: 2, escalate_after_chases: 2}   # when a sent item is due a follow-up
walkthrough: {first_promises: 3, suggested_people: 5, not_people_addresses: [info, support, sales, billing], not_people_names: [team, support, bank, store]}   # how many promises the first-result screen shows; how many people the people step suggests, and the address and name words that are never a person
series: {usually_with_share: 0.5, usually_with_min_meetings: 2, usually_with_max: 6}   # who a series is "usually with" on its page
brand: {color: "#8a3b5c", logo: null}   # the accent color; a logo is an image file in this config folder
notifications: {enabled: false, browser: true, webhook: null, webhook_format: plain, webhook_app: null, apps_extra: [], quiet_hours: {start: "21:00", end: "07:00"}, retry_minutes: 10, message_one: "1 decision waiting for you", message_many: "{count} decisions waiting for you", test_message: "This is a test. You will get a note like this when something needs you."}   # notices that something needs you: off until turned on, to you only, a count and never what an item is about
theme: system   # system, light or dark; each person can change it on their own device
density: comfortable   # comfortable or compact
